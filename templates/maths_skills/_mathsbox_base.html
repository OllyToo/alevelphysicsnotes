<!DOCTYPE html>
<html lang="en-UK">
<head>
	<title>Maths skills - {% block title %}{% endblock %}</title>

	<link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/mathskills.css') }}">

	<link href="https://fonts.googleapis.com/css?family=Noto+Sans|Roboto|Roboto+Slab|Titillium+Web" rel="stylesheet">

	<meta charset="UTF-8">
	<meta name="author" content="Oliver Toogood">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icons/favicon-32x32.png') }}" sizes="32x32" />
	<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icons/favicon-16x16.png') }}" sizes="16x16" />

	<!--MathJax v3 (CDN) — config must be set before the library script loads-->
	<script>
	  window.MathJax = {
	    tex: {
	      inlineMath: [['$', '$'], ['\\(', '\\)']],
	      macros: {
	        {% raw %}
	        quantity: ["{#1}\\;\\mathrm{#2}", 2],
	        units: ["\\mathrm{#1}", 1]
	        {% endraw %}
	      }
	    }
	  };
	</script>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

	<!--Google Analytics script-->
	<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
	  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
	  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
	  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
	  ga('create', 'UA-105574226-1', 'auto');
	  ga('send', 'pageview');
	</script>
</head>

<body id="mathsbox">
	<div class="skills-header">
		<img src="{{ url_for('static', filename='images/icons/logo_circle.svg') }}" alt="">
		<div class="skills-header-text">
			<span class="site-name">Mr Toogood's Physics</span>
			<span class="section-label">Maths skills &middot; quick reference</span>
		</div>
	</div>

	<div class="skills-body">
		<div class="skills-card">
			{% block content %}{% endblock %}
		</div>
	</div>

	<div class="skills-footer">
		<a href="{{ url_for('home') }}">&larr; Back to Mr Toogood's Physics</a>
	</div>
</body>

</html>
